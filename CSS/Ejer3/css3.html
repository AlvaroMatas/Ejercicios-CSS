<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ejercicio posicionamiento</title>
  <style type="text/css">
    
    div{
      background-color: rgb(223, 223, 223);
      padding: 5px;
      border: solid 1px rgb(197, 197, 197);
      overflow: hidden;
    }

    #anterior{
      float: left;
    }

    #siguiente{
      float: right;
    }

  </style>
</head>
  
<body>
  <div>
    <p id="anterior">&laquo; Anterior &nbsp;</p>
    <p id="siguiente">Siguiente &raquo;</p>
  </div>
</body>
</html>
